<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>turing AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/static/mylogo.png">
</head>

<body>

    <div id="assistant">
    <img src="/static/mylogo.png" alt="AI Assistant">
    <div id="assistantDialogue">
    </div>
    </div>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <img class="brand-logo" src="/static/mylogo.png" alt="My PDF Chatbot logo">
            </div>
            <nav aria-label="Sidebar">
                <a href="#">Chat</a>
                <a href="#">Uploaded PDFs</a>
                <a href="#">Recent conversations</a>
                <a href="#">Settings</a>
            </nav>
        </aside>
        <main class="main-content">
            <h1>My PDF RAG Chatbot</h1>
            <section class="upload-section" aria-label="Upload a PDF">
                <input type="file" id="pdfInput" accept=".pdf">
                <button id="uploadBtn">Upload PDF</button>
                <p id="uploadStatus" aria-live="polite"></p>
            </section>
            <h2>Chat with your PDF</h2>
            <div id="chatMessages" aria-live="polite"></div>
            <div class="question-row">
                <input type="text" id="questionInput" placeholder="Ask a question about your PDF">
                <button id="askBtn">Enter</button>
            </div>
        </main>
    </div>
    <script>

    // Each piece in our html file has a variable associated with it so we can reference it in our script
    const uploadBtn = document.getElementById("uploadBtn");
    const pdfInput = document.getElementById("pdfInput");
    const uploadStatus = document.getElementById('uploadStatus');
    const questionInput = document.getElementById('questionInput')
    const askBtn = document.getElementById('askBtn')
    const chatMessages = document.getElementById('chatMessages')

    // this will add functionality to our button
    uploadBtn.addEventListener("click", async function() {
        // index the latest file the user input
        const file = pdfInput.files[0];
        // if there is no file
        if (!file) {
            console.log("Please select a PDF first!");
            return;
        }
        // form data is like an empty bucket with the history of our uplaods
        const formData = new FormData();
        formData.append("file", file);
        console.log(formData.get("file").name);
        // this writes text into the existing element 
        uploadStatus.textContent = "Upload and Processing PDF...";
        // temporarily disabling the upload button so that the user doesn't try to upload something as the server process is happening 
        uploadBtn.disabled = true;

        // In case the server crashes and uvicorn can't connect to the server + FastAPI, then we need to 
        // tell the user that there has been a system error 
        try {
            // js sending out /upload http request 
            const response = await fetch("/upload",{
                // POST is how this function knows we're sending information OUT to the server
                method: "POST",
                body: formData
            });
            // provides us with the json file which contains info such as chunk count, embedding count, and the filename which is present in our /upload function in main.py
            const data = await response.json();

            
            // If the response is ok, it will return a message, and it won't if the response is not ok
            if (response.ok){
                uploadStatus.textContent = `Successfully uploaded ${data.filename} with ${data.chunk_count} chunks!`;
                // using the function established on the lower half of the script, I called it to move our assistant
                moveAssistantTo(chatMessages);
                assistantDialogue.textContent = "Your document is ready! You can ask anything about it"
            }
            else {
                uploadStatus.textContent = "Upload failed. Please try again."
            }

        } catch(error) {
            uploadStatus.textContent = "Cannot connect to server!";
            console.error(error);
        // this will run regradless of what happesn
        } finally {
            uploadBtn.disabled = false;
        }
    });
    askBtn.addEventListener("click", async function(){
        // Once the user types their question and clicks, the .value catches their response
        const question = questionInput.value.trim();
        if (!question) {
            return;
        }
        // this erases the text in questionInput so a user can type something else in the meantime
        questionInput.value = "";
        // this is the user's question displayed for the user
        const userMessage = document.createElement('p');
        userMessage.classList.add("user-message")
        userMessage.textContent = question;
        chatMessages.appendChild(userMessage);
        // scrollTop tells us how far the container has been scrolled vertically from the top and scrollHeight tells us the total height of the container's scrollable content
        // by making them equal to each other, JS says that the scroll position should be equal to the total current height essentially helping us scrollot the bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // this is the loading message while the browser awaits for the server's request
        const loadingMessage = document.createElement("p");
        loadingMessage.classList.add('bot-message')
        loadingMessage.textContent = "Ollama is thinking...";
        chatMessages.append(loadingMessage);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // afterwards this response is stored in data as a JS object along with its colleciton_name
        const data = {
                    question: question,
                    collection_name: "uploaded_pdf"
                };
         // once again, we're sending an HTTP request to the ask end point; we also disable the askBtn so the user asks questions one at a time
        askBtn.disabled = true; 
        try {
            const response = await fetch("/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                // turning JS into JSON data
                body: JSON.stringify(data)
            });
            // Converting JSON into JS once we get the result so we can now access the result JS object by doing result.the_answer
            const result = await response.json();

            if (response.ok) {
                // this changes the text inside that p element 
                loadingMessage.textContent = result.the_answer;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                loadingMessage.textContent = "Failed to get an answer.";
            }

            } catch (error) {
                loadingMessage.textContent = "Cannot connect to server.";
                console.error(error);
            } finally {
                // regardless of what happens the askBtn should once again reactivate
                askBtn.disabled = false;
            }

                
    });

    /* "keydown" fires when a user presses a key, and the event is an object containing the information about what happened */
    /* whenever the even.key == Enter aka whenever the user clicks the Enter button, the code triggers hte button's existing click listener*/
    /*Then the listener send sthe quesiton to FAST API Using fetch()*/
    questionInput.addEventListener("keydown", function(event)  {
        /*this condition detects keyboard's enter key*/
        if (event.key === "Enter") {
            askBtn.click()
        }
    });
    const assistant = document.getElementById("assistant");
    const mainContent = document.querySelector('.main-content');

    requestAnimationFrame(function() {
        /* Once the page loads and parses the html, assistant should move to the center */
        requestAnimationFrame(function() {
            // This tells us where the mainContent is positioned at + how large it is 
            const rect = mainContent.getBoundingClientRect();
            // based off the measurements of rect, we'll calculate the center so the assistant will move exactly at the center regradless of what screen we use
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            assistant.style.left = `${centerX - assistant.offsetWidth / 2}px`;
            assistant.style.top = `${centerY - assistant.offsetHeight / 2}px`;
        });
    });

    const assistantDialogue = document.getElementById("assistantDialogue")

    function introduceAssistant(event) {
        if (event.propertyName !== "left") {
            return;
        }
        assistantDialogue.textContent =
            "Hello! I'm 343 guilty spark. I can answer questions about PDFs you upload! For now, I can only read extractable text.";
        assistant.removeEventListener("transitionend", introduceAssistant);


    const uploadSection = document.querySelector('.upload-section')
    // the agent will wait for a few seconds until it finally moves on to the next action
    setTimeout(function() {
        const rect = uploadSection.getBoundingClientRect();
        // this will move the AI assistant right above the uploads element 
        assistant.style.left = `${rect.left + rect.width / 2 - assistant.offsetWidth / 2}px`;
        assistant.style.top = `${rect.top - assistant.offsetHeight - 20}px`;
        assistantDialogue.textContent = "Please upload a document here!"

    }, 4000);
    }
    assistant.addEventListener("transitionend", introduceAssistant);



    // I dont' want to rewrite where the assistant moves every time, so I'll use this funciton so the assistant can move close to whatever element 
    function moveAssistantTo(element) {
        const rect = element.getBoundingClientRect();

        const centerX = rect.left + rect.width / 2;

        assistant.style.left =
            `${centerX - assistant.offsetWidth / 2}px`;

        assistant.style.top =
            `${rect.top - assistant.offsetHeight - 20}px`;
    }



    </script>
    <style>
    :root {
        color-scheme: dark;
        --page-bg: #080b09;
        --sidebar-bg: #0d130f;
        --surface-bg: #111a14;
        --surface-border: #26382b;
        --text-primary: #edf5ef;
        --text-muted: #a5b4a8;
        --green-dark: #164b2c;
        --green-light: #8de0a6;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background-color: var(--page-bg);
        color: var(--text-primary);
        font-family: Arial, sans-serif;
    }

    .app-layout {
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        flex: 0 0 240px;
        padding: 28px 20px;
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--surface-border);
        color: var(--text-primary);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
    }

    .brand-logo {
        display: block;
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
        border-radius: 50%;
        object-fit: cover;
        mix-blend-mode: screen;
        filter: drop-shadow(0 0 8px rgb(80 255 40 / 25%));
    }

    .sidebar h2 {
        margin: 0;
        font-size: 1.2rem;
    }

    .sidebar nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .sidebar a {
        padding: 10px 12px;
        border-radius: 6px;
        color: var(--text-muted);
        text-decoration: none;
    }

    .sidebar a:hover {
        background-color: var(--surface-bg);
        color: var(--green-light);
    }

    .sidebar a:first-child {
        background-color: var(--green-dark);
        color: var(--text-primary);
    }

    .main-content {
        width: 100%;
        max-width: 1100px;
        margin-left: auto;
        padding: 36px clamp(24px, 5vw, 72px);
    }

    .upload-section {
        margin: 24px 0;
        padding: 16px;
        border: 1px solid var(--surface-border);
        border-radius: 8px;
        background-color: var(--surface-bg);
    }

    #uploadStatus {
        min-height: 1.2em;
        margin-bottom: 0;
        color: var(--green-light);
    }

    .user-message {
        background-color: var(--green-dark);
        padding: 12px;
        border-radius: 12px;
        max-width: 70%;
        color: var(--text-primary);
        align-self: flex-end; /* This will override the parent's css setting of flex-start, so user-messges will now be on the right  */
    }

    .bot-message {
        background-color: var(--surface-bg);
        padding: 12px;
        border-radius: 12px;
        max-width: 70%;
        color: var(--text-primary);
        align-self: flex-start
    }
    #chatMessages {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        height: 400px;
        padding: 16px;
        border: 1px solid var(--surface-border);
        border-radius: 8px;
        background-color: #0b100d;
        overflow-y: auto;
    }

    .question-row {
        display: flex;
        gap: 10px;
        margin-top: 12px;
    }

    #questionInput {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--surface-border);
        border-radius: 6px;
        background-color: var(--surface-bg);
        color: var(--text-primary);
        font: inherit;
    }

    #questionInput::placeholder {
        color: var(--text-muted);
    }

    #questionInput:focus {
        outline: 2px solid var(--green-light);
        outline-offset: 2px;
    }

    button {
        padding: 8px 14px;
        border: 1px solid var(--green-dark);
        border-radius: 6px;
        background-color: var(--green-dark);
        color: var(--text-primary);
        font: inherit;
        cursor: pointer;
    }

    button:hover:not(:disabled) {
        background-color: #20663a;
        border-color: var(--green-light);
    }

    button:focus-visible {
        outline: 2px solid var(--green-light);
        outline-offset: 2px;
    }

    button:disabled {
        cursor: wait;
        opacity: 0.65;
    }

    input[type="file"] {
        max-width: 100%;
        color: var(--text-muted);
    }

    input[type="file"]::file-selector-button {
        margin-right: 10px;
        padding: 8px 12px;
        border: 1px solid var(--surface-border);
        border-radius: 6px;
        background-color: #0b100d;
        color: var(--text-primary);
        cursor: pointer;
    }

    input[type="file"]::file-selector-button:hover {
        border-color: var(--green-light);
    }

    #askBtn {
        min-width: 75px;
        padding: 8px 12px;
    }

    @media (max-width: 640px) {
        .app-layout {
            flex-direction: column;
        }

        .sidebar {
            flex-basis: auto;
            padding: 16px;
        }

        .brand {
            margin-bottom: 12px;
        }

        .sidebar nav {
            flex-direction: row;
            flex-wrap: wrap;
        }

        .main-content {
            padding: 24px 16px;
        }
    }

    #assistant {
        position: fixed;
        /* By default, this is where the logo will be, but in the javascript we will move it to the center */ 
        left: 260px;
        top: 120px;
        display: flex;
        align-items: center;
        gap: 15px;
        z-index: 100;
        /* This will create a slow transition over 1.5s */
        transition: left 1.5s ease-in-out, top 1.5s ease-in-out;
    }

    #assistant img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        border-radius: 50%;
        filter: drop-shadow(0 0 12px #7fff00);
        
    }

    #assistantDialogue {
        max-width: 260px;
        padding: 15px;
        background: #112016;
        color: #b7ff8a;
        border: 1px solid #7fff00;
        border-radius: 12px;
    }

    </style>

</body>
</html>
